namespace: omerfsen
name: nvkr
version: 0.0.0 # x-release-please-version
readme: README.md
authors:
  - Omer Sen
description: >-
  Build NVIDIA Kubernetes Engine (NVKE) artifacts with NVIDIA Kubernetes
  Recipes (NVKR): the pinned nvkr CLI, a local OCI registry, local Runs that
  publish a Release, consumer-side verification, and a handoff of the node
  image and nvkectl to omerfsen.nvke.
license:
  - Apache-2.0

